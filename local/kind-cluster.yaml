# ---------------------------------------------------------------------------
# Lokaler Cluster, der die AKS-Struktur nachbildet:
#   - ein Control-Plane-Knoten (entspricht dem System-Pool)
#   - zwei Worker mit Label workload=apps (entspricht dem User-Pool)
# Damit laufen dieselben nodeSelector-Regeln wie in Azure.
# ---------------------------------------------------------------------------
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: demo

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

  - role: worker
    labels:
      workload: apps

  - role: worker
    labels:
      workload: apps
